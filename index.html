<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <title>3 MONTHS｜片付けコーチ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 初回設定（3ステップ） -->
  <section class="onboarding" id="onboarding" hidden aria-label="はじめの設定">
    <div class="onboarding-inner" id="onboarding-body"></div>
  </section>

  <div class="app" id="app" hidden>
    <main class="main" id="main">

      <!-- 今日 -->
      <section class="view" id="view-today" data-view="today" aria-labelledby="today-heading">
        <header class="today-header">
          <div class="today-header-text">
            <p class="brand">3 MONTHS</p>
            <h1 class="tagline" id="today-heading">片付けコーチ</h1>
            <p class="today-date" id="today-date"></p>
            <p class="year-remaining" id="challenge-remaining"></p>
          </div>
          <div class="stamp" id="today-stamp" role="img"></div>
        </header>

        <div class="today-goal" id="today-area"></div>
        <div class="today-body" id="today-body"></div>
      </section>

      <!-- カレンダー -->
      <section class="view" id="view-calendar" data-view="calendar" aria-labelledby="calendar-heading" hidden>
        <h1 class="view-title" id="calendar-heading">カレンダー</h1>

        <div class="calendar-nav">
          <button class="icon-button" type="button" data-action="prev-month" aria-label="前の月">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <p class="calendar-month" id="calendar-month" aria-live="polite"></p>
          <button class="icon-button" type="button" data-action="next-month" aria-label="次の月">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="calendar-today-row" id="current-month-row" hidden>
          <button class="button button--text" type="button" data-action="current-month" id="current-month-button">今月に戻る</button>
        </div>

        <div class="calendar">
          <div class="calendar-weekdays" aria-hidden="true">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <ul class="calendar-legend">
          <li><span class="legend-mark mark-task" aria-hidden="true"></span>選んだ・記録した</li>
          <li><span class="legend-mark mark-done" aria-hidden="true">✓</span>できた</li>
          <li><span class="legend-mark mark-partial" aria-hidden="true">✓</span>少しできた</li>
        </ul>
        <p class="calendar-hint">日付を押すと、その日の記録を見たり、結果を直したりできます。</p>
      </section>

      <!-- 3か月 -->
      <section class="view" id="view-plan" data-view="plan" aria-labelledby="plan-heading" hidden>
        <h1 class="view-title" id="plan-heading">3か月のプラン</h1>
        <div class="plan-body" id="plan-body"></div>

        <div class="backup-zone">
          <h2 class="backup-zone-title">データのバックアップ</h2>
          <p class="backup-zone-note">端末やURLを変える前に、記録をJSONファイルに保存できます。</p>
          <div class="backup-actions">
            <button class="button button--secondary" type="button" data-action="export-data">データを書き出す</button>
            <button class="button button--secondary" type="button" data-action="import-data">データを読み込む</button>
          </div>
          <input class="visually-hidden" id="import-data-file" type="file" accept="application/json,.json" aria-label="バックアップJSONファイルを選択">
        </div>

        <div class="danger-zone">
          <button class="button button--danger" type="button" data-action="reset-data">データをリセット</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="画面の切り替え">
      <button class="nav-button" type="button" data-action="navigate" data-target="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-button" type="button" data-action="navigate" data-target="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <span>カレンダー</span>
      </button>
      <button class="nav-button" type="button" data-action="navigate" data-target="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16"/><path d="M6.5 16.5v-4M12 16.5V9M17.5 16.5V5.5"/></svg>
        <span>3か月</span>
      </button>
    </nav>
  </div>

  <!-- 日付の記録 -->
  <dialog class="day-dialog" id="day-dialog" aria-labelledby="day-dialog-title">
    <div class="day-dialog-inner">
      <header class="day-dialog-header">
        <h2 class="day-dialog-title" id="day-dialog-title"></h2>
        <p class="day-dialog-sub" id="day-dialog-sub"></p>
      </header>
      <div id="day-dialog-body"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="coach.js"></script>
  <script src="script.js"></script>
</body>
</html>
